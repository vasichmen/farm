schema: spec-driven

# Project context — constraints for OpenSpec artifacts and workflows.
context: |
  Имя change'а и capability — английский kebab-case по смыслу, глагол + объект:
  add-design-system-foundation, fix-season-wheel-scroll. Русское описание сначала
  переводится на английский. Транслитерация и «slug по символам» запрещены: имя из
  одних дефисов, цифр или случайных обрубков (-----1, change-2) недопустимо.
  Если осмысленное английское имя не получается — спросить пользователя, не выдумывать.

  Содержимое артефактов (proposal, design, tasks, specs) — по-русски, как остальная
  документация проекта. Английский — только в именах каталогов, ID, коде и enum-значениях.

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always state what is out of scope
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Advisory guidance for how apply and archive work should be conducted.
operations:
  apply:
    guidance:
      - "Когда все задачи change'а закрыты, напомнить, что фазу надо отметить в
        docs/plan/PLAN.md, и обновить PLAN.md сразу после архивации change'а."
  archive:
    guidance:
      - "Архивация change'а = закрытие фазы из docs/plan/PLAN.md. После архивации
        обязательно обновить PLAN.md в этой же сессии, иначе фаза считается незакрытой."
      - "В таблице §3 «Сводка фаз» поставить статус «✅ сделано» и вписать имя
        заархивированного change'а в колонку «Change»."
      - "В заголовке фазы в §4 заменить «— ⬜ не начата» на «— ✅ сделано»."
      - "Обновить строку «Текущая точка» в шапке файла, а при необходимости — списки
        §1.1 «Что уже работает» и §1.2 «Чего ещё нет»."
      - "Заголовок и строка статуса должны совпадать с фактическим содержимым
        openspec/changes/archive на конец сессии; откладывать отметку до фазы 13 нельзя."
